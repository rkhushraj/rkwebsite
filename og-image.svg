<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf4ec"/>
      <stop offset="1" stop-color="#f3e7d6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="12%" cy="0%" r="55%">
      <stop offset="0" stop-color="#c0623f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c0623f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="98%" cy="12%" r="50%">
      <stop offset="0" stop-color="#7a8450" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7a8450" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- RK monogram -->
  <g transform="translate(96,96)">
    <circle cx="46" cy="46" r="45" fill="none" stroke="#2e2a26" stroke-width="2.5"/>
    <text x="46" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="600" letter-spacing="1" fill="#2e2a26" text-anchor="middle">RK</text>
  </g>

  <!-- eyebrow -->
  <text x="98" y="288" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#c0623f">HELLO, I'M</text>

  <!-- name -->
  <text x="94" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700" letter-spacing="-2" fill="#2e2a26">Rohan Khushraj</text>

  <!-- tagline -->
  <text x="98" y="452" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-style="italic" fill="#7a8450">Youth Fencer &amp; Author</text>

  <!-- project chips -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#4a3a26">
    <g transform="translate(98,516)">
      <rect x="0" y="0" width="190" height="56" rx="28" fill="#fffaf3" stroke="#e7dccb" stroke-width="1.5"/>
      <text x="95" y="36" text-anchor="middle">ChemScape</text>
    </g>
    <g transform="translate(304,516)">
      <rect x="0" y="0" width="176" height="56" rx="28" fill="#fffaf3" stroke="#e7dccb" stroke-width="1.5"/>
      <text x="88" y="36" text-anchor="middle">BioSpark</text>
    </g>
    <g transform="translate(496,516)">
      <rect x="0" y="0" width="158" height="56" rx="28" fill="#fffaf3" stroke="#e7dccb" stroke-width="1.5"/>
      <text x="79" y="36" text-anchor="middle">Worth It</text>
    </g>
  </g>

  <!-- domain, bottom right -->
  <text x="1104" y="566" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#8a7258" text-anchor="end">rohankhushraj.com</text>
</svg>
